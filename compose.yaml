services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tvpn
      POSTGRES_USER: tvpn
      POSTGRES_PASSWORD: ${TVPN_POSTGRES_PASSWORD:-tvpn-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvpn -d tvpn"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tvpn-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    user: "${TVPN_CONTAINER_UID:-1000}:${TVPN_CONTAINER_GID:-1000}"
    environment:
      TVPN_DATABASE_URL: ${TVPN_DATABASE_URL:-postgres://tvpn:${TVPN_POSTGRES_PASSWORD:-tvpn-development-only}@postgres:5432/tvpn?sslmode=disable}
      TVPN_APP_ORIGIN: ${TVPN_APP_ORIGIN:-http://app.${TVPN_ACCESS_DOMAIN:-localhost}:${TVPN_PORT:-8080}}
      TVPN_PROXY_BASE_DOMAIN: ${TVPN_PROXY_BASE_DOMAIN:-proxy.${TVPN_ACCESS_DOMAIN:-localhost}:${TVPN_PORT:-8080}}
      TVPN_ENV: ${TVPN_ENV:-development}
      TVPN_MASTER_KEY_FILE: /run/secrets/tvpn_master_key
      TVPN_BOOTSTRAP_ADMIN_USERNAME: ${TVPN_BOOTSTRAP_ADMIN_USERNAME:-}
      TVPN_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/tvpn_bootstrap_admin_password
    ports:
      - "${TVPN_BIND_ADDRESS:-0.0.0.0}:${TVPN_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - tvpn_master_key
      - tvpn_bootstrap_admin_password
    healthcheck:
      test: ["CMD", "/tvpn", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  tvpn-postgres:

secrets:
  tvpn_master_key:
    file: ./secrets/tvpn_master_key
  tvpn_bootstrap_admin_password:
    file: ./secrets/tvpn_bootstrap_admin_password
