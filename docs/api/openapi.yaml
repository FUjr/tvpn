openapi: 3.1.0
info:
  title: Tvpn API
  version: 0.2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated session }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200': { description: Current session }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: Session removed }
  /auth/tokens/:
    get:
      operationId: listProgramTokens
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Active token metadata; secrets are never returned }
    post:
      operationId: createProgramToken
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [proxy, admin] }
                expires_at: { type: string, format: date-time, description: Defaults to 90 days and cannot exceed 366 days }
      responses:
        '201': { description: Token metadata and the one-time secret }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/tokens/{id}:
    delete:
      operationId: revokeProgramToken
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Token revoked }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/users:
    get:
      operationId: listUsers
      responses:
        '200': { description: Users with directly assigned policy IDs }
    post:
      operationId: createLocalUser
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '201': { description: Local user created }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: User updated }
  /admin/users/{id}/password:
    post:
      operationId: resetLocalPassword
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Password changed and existing sessions removed }
  /admin/users/{id}/policies:
    put:
      operationId: setUserPolicies
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Assignments replaced }
  /admin/policies:
    get:
      operationId: listPolicies
      responses:
        '200': { description: Policies and rules }
    post:
      operationId: createPolicy
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '201': { description: Policy created }
  /admin/policies/{id}:
    put:
      operationId: updatePolicy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Policy and rules replaced }
    delete:
      operationId: deletePolicy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Policy deleted }
  /admin/ldap:
    get:
      operationId: getLDAPSettings
      responses:
        '200': { description: Non-secret LDAP settings }
    put:
      operationId: updateLDAPSettings
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: LDAP settings updated }
  /admin/ldap/test:
    post:
      operationId: testLDAP
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: LDAP connection and service bind succeeded }
  /admin/ldap/groups:
    get:
      operationId: listLDAPGroups
      responses:
        '200': { description: Known LDAP groups and policy IDs }
  /admin/ldap/groups/{id}/policies:
    put:
      operationId: setLDAPGroupPolicies
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Assignments replaced }
  /admin/audit:
    get:
      operationId: listAuditEvents
      responses:
        '200': { description: Most recent 200 audit events }
  /admin/upstream-proxies:
    get:
      operationId: listUpstreamProxies
      responses:
        '200': { description: Upstream proxies without passwords, including direct user and LDAP group assignment IDs }
    post:
      operationId: createUpstreamProxy
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '201': { description: HTTP or SOCKS5 upstream proxy created }
  /admin/upstream-proxies/{id}:
    put:
      operationId: updateUpstreamProxy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Upstream proxy updated; an empty password retains the encrypted value }
    delete:
      operationId: deleteUpstreamProxy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Upstream proxy and contexts using it deleted }
  /admin/upstream-proxies/{id}/users:
    put:
      operationId: setUpstreamProxyUsers
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Direct user assignments replaced }
  /admin/upstream-proxies/{id}/groups:
    put:
      operationId: setUpstreamProxyLDAPGroups
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: LDAP group assignments replaced }
  /admin/direct-access:
    get:
      operationId: getDirectAccessACL
      responses:
        '200': { description: Direct access restriction state and assigned user and LDAP group IDs }
    put:
      operationId: updateDirectAccessACL
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Direct access ACL enabled or disabled }
  /admin/direct-access/users:
    put:
      operationId: setDirectAccessUsers
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Direct access user assignments replaced }
  /admin/direct-access/groups:
    put:
      operationId: setDirectAccessLDAPGroups
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Direct access LDAP group assignments replaced }
  /proxy/upstreams/:
    get:
      operationId: listAvailableUpstreamProxies
      responses:
        '200': { description: Enabled granted upstream proxies and whether the current user may use direct access }
  /proxy/contexts/:
    post:
      operationId: createProxyContext
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                upstream_proxy_id: { type: string, format: uuid, nullable: true }
                compatibility_mode: { type: boolean, default: false }
      responses:
        '201': { description: Context with the selected optional upstream_proxy_id and compatibility_mode, one-time bootstrap URL and route URL }
        '403': { $ref: '#/components/responses/Problem' }
  /proxy/contexts/{id}:
    get:
      operationId: getProxyContext
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Proxy context }
    delete:
      operationId: closeProxyContext
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Context closed and routes invalidated }
  /proxy/contexts/{id}/navigate:
    post:
      operationId: navigateProxyContext
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '200': { description: New one-time bootstrap URL and route URL }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tvpn_session
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: tvpn_pat
      description: Program token for management APIs. Proxy endpoints require the proxy scope; admin endpoints require admin scope and an administrator owner.
    proxyBearerToken:
      type: apiKey
      in: header
      name: Proxy-Authorization
      description: Use `Bearer tvpn_pat_...` on route_url. Tvpn consumes this header and never forwards it upstream.
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    ID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 compatible error
      headers:
        Tvpn-Error-Code:
          required: true
          description: Protected marker used by SDKs to distinguish Tvpn failures from target RFC Problem responses
          schema: { type: string }
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, message_id, message]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              message_id: { type: string }
              message: { type: string }
