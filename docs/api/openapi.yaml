openapi: 3.1.0
info:
  title: Tvpn API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated session }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200': { description: Current session }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: Session removed }
  /admin/users:
    get:
      operationId: listUsers
      responses:
        '200': { description: Users with directly assigned policy IDs }
    post:
      operationId: createLocalUser
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '201': { description: Local user created }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: User updated }
  /admin/users/{id}/password:
    post:
      operationId: resetLocalPassword
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Password changed and existing sessions removed }
  /admin/users/{id}/policies:
    put:
      operationId: setUserPolicies
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Assignments replaced }
  /admin/policies:
    get:
      operationId: listPolicies
      responses:
        '200': { description: Policies and rules }
    post:
      operationId: createPolicy
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '201': { description: Policy created }
  /admin/policies/{id}:
    put:
      operationId: updatePolicy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Policy and rules replaced }
    delete:
      operationId: deletePolicy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Policy deleted }
  /admin/ldap:
    get:
      operationId: getLDAPSettings
      responses:
        '200': { description: Non-secret LDAP settings }
    put:
      operationId: updateLDAPSettings
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: LDAP settings updated }
  /admin/ldap/test:
    post:
      operationId: testLDAP
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: LDAP connection and service bind succeeded }
  /admin/ldap/groups:
    get:
      operationId: listLDAPGroups
      responses:
        '200': { description: Known LDAP groups and policy IDs }
  /admin/ldap/groups/{id}/policies:
    put:
      operationId: setLDAPGroupPolicies
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Assignments replaced }
  /admin/audit:
    get:
      operationId: listAuditEvents
      responses:
        '200': { description: Most recent 200 audit events }
components:
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    ID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 compatible error
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
